services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "8787"
      MEDINEXUS_HOST: 0.0.0.0
      MEDINEXUS_PUBLIC_ORIGIN: ${MEDINEXUS_PUBLIC_ORIGIN:?Set MEDINEXUS_PUBLIC_ORIGIN in .env}
      MEDINEXUS_DB_PATH: /app/data/medinexus.sqlite
      MEDINEXUS_STATIC_DIR: /app/dist
    volumes:
      - medinexus_data:/app/data
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env to a DNS name pointing at this server}
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  medinexus_data:
  caddy_data:
  caddy_config:
